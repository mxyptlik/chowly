services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chowly
      POSTGRES_USER: chowly
      POSTGRES_PASSWORD: chowly
    ports:
      - "5432:5432"
    volumes:
      - chowly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chowly -d chowly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - chowly_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      CHOWLY_DATABASE_URL: postgresql+psycopg://chowly:chowly@postgres:5432/chowly
      CHOWLY_REDIS_URL: redis://redis:6379/0
      CHOWLY_CORS_ORIGINS: http://localhost:3000
      CHOWLY_REALTIME_SIGNING_SECRET: change-this-in-production-at-least-32-chars
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: ["dramatiq", "app.tasks", "--processes", "2", "--threads", "4"]
    environment:
      CHOWLY_DATABASE_URL: postgresql+psycopg://chowly:chowly@postgres:5432/chowly
      CHOWLY_REDIS_URL: redis://redis:6379/0
      CHOWLY_REALTIME_SIGNING_SECRET: change-this-in-production-at-least-32-chars
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from app.worker import job_state_redis; assert job_state_redis().ping()"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  chowly_postgres:
  chowly_redis:
